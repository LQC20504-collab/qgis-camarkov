name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 引擎自检只需要 numpy + scipy（它在 import rasterio 之前就返回了），
      # 所以 CI 不装 rasterio/sklearn/matplotlib，省时间也省失败的借口。
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pytest

      - name: Run pure-Python tests
        run: python -m pytest -m "not qgis" -v

      # 集成测试需要本机 QGIS（qgis_process），CI 里没有，靠 marker 自动跳过。
      - name: Confirm QGIS tests are skipped, not failing
        run: python -m pytest -m qgis -q || true

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build plugin zip
        run: |
          python scripts/build_zip.py
          python - <<'PY'
          import glob, zipfile, sys
          paths = sorted(glob.glob("dist/qgis_camarkov-*.zip"))
          assert paths, "no plugin zip was built"
          archive = zipfile.ZipFile(paths[-1])
          tops = {n.split("/")[0] for n in archive.namelist()}
          # ZIP 安装要求只有一个顶层包目录，且名字必须是合法标识符
          assert tops == {"qgis_camarkov"}, tops
          assert any("engine/camarkov_engine.py" in n for n in archive.namelist())
          assert not any("__pycache__" in n for n in archive.namelist())
          print("zip layout ok")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qgis-camarkov-plugin
          path: dist/*.zip
